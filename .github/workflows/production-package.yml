name: Production package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  production_package:
    name: Production package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python 3.14
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Set up uv
        # astral-sh/setup-uv v9.0.0
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.28"
          checksum: e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: production-package-py3.14
          prune-cache: true
          restore-cache: true
          save-cache: true
      - name: Verify base tools and versions
        run: |
          command -v sha256sum
          python --version
          uv --version
          test "$(uv --version | awk '{print $1, $2}')" = "uv 0.11.28"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Build and smoke-test the package
        run: make package-check
      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -- *.whl *.tar.gz > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload production package
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-package
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
